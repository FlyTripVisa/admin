<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://flytripvisa.site/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>FlyTripVisa Admin · Login</title>
  <meta name="description" content="FlyTripVisa Admin – Secure login for visa, flights & hotel management.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-grid"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="https://pub-b261978d710f40a0944a1ed1d89e1399.r2.dev/Img/flytripvisa-logo1.png" alt="FlyTripVisa Logo">
      </div>
      <h1 class="auth-title">Admin Login</h1>
      <p class="auth-sub">Sign in to manage visas, flights & bookings</p>

      <div class="alert alert-error" id="alert-box">
        <i class="fas fa-exclamation-circle"></i>
        <span id="alert-text"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            >
            <i class="fas fa-user input-icon"></i>
          </div>
          <div class="error-msg" id="username-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <i class="fas fa-lock input-icon"></i>
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="error-msg" id="password-error"></div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember">
            <span>Remember me</span>
          </label>
          <a class="forgot-link" href="#" onclick="FTV.toast('Password recovery coming soon.')">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="spinner" id="spinner"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div class="divider">or continue with</div>

      <div class="social-login">
        <button class="social-btn" type="button" onclick="FTV.toast('Google SSO coming soon.')" aria-label="Google">
          <i class="fab fa-google"></i>
        </button>
        <button class="social-btn" type="button" onclick="FTV.toast('GitHub SSO coming soon.')" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </button>
        <button class="social-btn" type="button" onclick="FTV.toast('WeChat SSO coming soon.')" aria-label="WeChat">
          <i class="fab fa-weixin"></i>
        </button>
      </div>

      <p class="auth-foot">
        Don't have an account?
        <a href="/signup.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
  <script>
    (function () {
      // If already logged in, bounce to dashboard
      if (window.FTV && window.FTV.Auth) {
        window.FTV.Auth.redirectIfAuthed("dashboard.html");
      }

      const form = document.getElementById("login-form");
      const alertBox = document.getElementById("alert-box");
      const alertText = document.getElementById("alert-text");
      const submitBtn = document.getElementById("submit-btn");
      const btnText = document.getElementById("btn-text");
      const spinner = document.getElementById("spinner");

      function showAlert(msg) {
        alertText.textContent = msg;
        alertBox.classList.add("show");
      }

      function clearAlert() {
        alertBox.classList.remove("show");
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        spinner.classList.toggle("show", isLoading);
        btnText.textContent = isLoading ? "Signing in..." : "Sign In";
      }

      function validateField(input, errorEl, validator) {
        const msg = validator(input.value);
        input.classList.toggle("invalid", !!msg);
        errorEl.textContent = msg || "";
        errorEl.classList.toggle("show", !!msg);
        return !msg;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        clearAlert();

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const uErr = document.getElementById("username-error");
        const pErr = document.getElementById("password-error");

        const v1 = validateField(
          usernameInput,
          uErr,
          window.FTV.Auth.validators.username
        );
        const v2 = validateField(
          passwordInput,
          pErr,
          window.FTV.Auth.validators.password
        );

        if (!v1 || !v2) return;

        setLoading(true);

        try {
          await window.FTV.Auth.login({
            username: usernameInput.value,
            password: passwordInput.value,
            remember: document.getElementById("remember").checked
          });
          window.FTV.toast("Login successful! Redirecting...");
          setTimeout(function () {
            window.location.href = "dashboard.html";
          }, 600);
        } catch (err) {
          showAlert(err.message || "Login failed. Please try again.");
          setLoading(false);
        }
      });

      // Live validation on blur
      document.getElementById("username").addEventListener("blur", function () {
        validateField(
          this,
          document.getElementById("username-error"),
          window.FTV.Auth.validators.username
        );
      });

      document.getElementById("password").addEventListener("blur", function () {
        validateField(
          this,
          document.getElementById("password-error"),
          window.FTV.Auth.validators.password
        );
      });

      // Toggle password visibility
      document.getElementById("toggle-password").addEventListener("click", function () {
        const pwd = document.getElementById("password");
        const icon = this.querySelector("i");
        if (pwd.type === "password") {
          pwd.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          pwd.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      });
    })();
  </script>
</body>
</html>
