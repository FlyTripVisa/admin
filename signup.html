<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://flytripvisa.site/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>FlyTripVisa Admin · Create Account</title>
  <meta name="description" content="FlyTripVisa Admin – Create a new admin account to manage visa, flights & hotel bookings.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-grid"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="https://pub-b261978d710f40a0944a1ed1d89e1399.r2.dev/Img/flytripvisa-logo1.png" alt="FlyTripVisa Logo">
      </div>
      <h1 class="auth-title">Create Admin Account</h1>
      <p class="auth-sub">Register to access the FlyTripVisa dashboard</p>

      <div class="alert alert-error" id="alert-box">
        <i class="fas fa-exclamation-circle"></i>
        <span id="alert-text"></span>
      </div>

      <div class="alert alert-success" id="success-box">
        <i class="fas fa-check-circle"></i>
        <span id="success-text"></span>
      </div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Choose a username"
              autocomplete="username"
              required
            >
            <i class="fas fa-user input-icon"></i>
          </div>
          <div class="error-msg" id="username-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrap">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="name@flytripvisa.com"
              autocomplete="email"
              required
            >
            <i class="fas fa-envelope input-icon"></i>
          </div>
          <div class="error-msg" id="email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              autocomplete="new-password"
              required
            >
            <i class="fas fa-lock input-icon"></i>
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="error-msg" id="password-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">Confirm Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="confirm"
              name="confirm"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            >
            <i class="fas fa-shield-halved input-icon"></i>
          </div>
          <div class="error-msg" id="confirm-error"></div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="terms" name="terms" required>
            <span>I agree to the <a href="https://flytripvisa.site/service_terms.html" target="_blank" style="color:var(--brand);">Terms</a> &amp; <a href="https://flytripvisa.site/privacy_policy.html" target="_blank" style="color:var(--brand);">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="spinner" id="spinner"></span>
          <span id="btn-text">Create Account</span>
        </button>
      </form>

      <p class="auth-foot">
        Already have an account?
        <a href="/login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
  <script>
    (function () {
      if (window.FTV && window.FTV.Auth) {
        window.FTV.Auth.redirectIfAuthed("dashboard.html");
      }

      const form = document.getElementById("signup-form");
      const alertBox = document.getElementById("alert-box");
      const alertText = document.getElementById("alert-text");
      const successBox = document.getElementById("success-box");
      const successText = document.getElementById("success-text");
      const submitBtn = document.getElementById("submit-btn");
      const btnText = document.getElementById("btn-text");
      const spinner = document.getElementById("spinner");

      function showAlert(msg) {
        alertText.textContent = msg;
        alertBox.classList.add("show");
        successBox.classList.remove("show");
      }

      function showSuccess(msg) {
        successText.textContent = msg;
        successBox.classList.add("show");
        alertBox.classList.remove("show");
      }

      function clearMessages() {
        alertBox.classList.remove("show");
        successBox.classList.remove("show");
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        spinner.classList.toggle("show", isLoading);
        btnText.textContent = isLoading ? "Creating account..." : "Create Account";
      }

      function validateField(input, errorEl, validator, extra) {
        const msg = validator(input.value, extra);
        input.classList.toggle("invalid", !!msg);
        errorEl.textContent = msg || "";
        errorEl.classList.toggle("show", !!msg);
        return !msg;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        clearMessages();

        const u = document.getElementById("username");
        const em = document.getElementById("email");
        const p = document.getElementById("password");
        const c = document.getElementById("confirm");
        const terms = document.getElementById("terms");

        const v1 = validateField(
          u,
          document.getElementById("username-error"),
          window.FTV.Auth.validators.username
        );
        const v2 = validateField(
          em,
          document.getElementById("email-error"),
          window.FTV.Auth.validators.email
        );
        const v3 = validateField(
          p,
          document.getElementById("password-error"),
          window.FTV.Auth.validators.password
        );
        const v4 = validateField(
          c,
          document.getElementById("confirm-error"),
          window.FTV.Auth.validators.confirm,
          p.value
        );

        if (!terms.checked) {
          showAlert("Please accept the Terms & Privacy Policy.");
          return;
        }

        if (!v1 || !v2 || !v3 || !v4) return;

        setLoading(true);

        try {
          await window.FTV.Auth.register({
            username: u.value,
            email: em.value,
            password: p.value,
            confirm: c.value
          });
          showSuccess("Account created! Redirecting to dashboard...");
          window.FTV.toast("Welcome aboard! 🎉");
          setTimeout(function () {
            window.location.href = "dashboard.html";
          }, 900);
        } catch (err) {
          showAlert(err.message || "Registration failed. Please try again.");
          setLoading(false);
        }
      });

      // Live validation
      const fields = [
        { id: "username", err: "username-error", fn: "username" },
        { id: "email", err: "email-error", fn: "email" },
        { id: "password", err: "password-error", fn: "password" }
      ];

      fields.forEach(function (f) {
        const el = document.getElementById(f.id);
        el.addEventListener("blur", function () {
          validateField(
            el,
            document.getElementById(f.err),
            window.FTV.Auth.validators[f.fn]
          );
        });
        el.addEventListener("input", function () {
          if (el.classList.contains("invalid")) {
            validateField(
              el,
              document.getElementById(f.err),
              window.FTV.Auth.validators[f.fn]
            );
          }
        });
      });

      const confirmEl = document.getElementById("confirm");
      confirmEl.addEventListener("blur", function () {
        validateField(
          confirmEl,
          document.getElementById("confirm-error"),
          window.FTV.Auth.validators.confirm,
          document.getElementById("password").value
        );
      });

      // Toggle password
      document.getElementById("toggle-password").addEventListener("click", function () {
        const pwd = document.getElementById("password");
        const icon = this.querySelector("i");
        if (pwd.type === "password") {
          pwd.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          pwd.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      });
    })();
  </script>
</body>
</html>
